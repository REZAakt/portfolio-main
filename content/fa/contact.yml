contactTitle: 'راه‌های تماس'
contactDescription: 'راحت‌ترین راه ارتباط را انتخاب کنید.'

contactCards:
  - title: 'ایمیل'
    description: 'بهترین راه برای درخواست پروژه، توضیح دامنه کار، همکاری و گفت‌وگوی فنی جدی.'
    icon: 'i-lucide-mail'
    label: 'ارسال ایمیل'
    buttonIcon: 'i-lucide-send'
    to: 'email'

  - title: 'تلفن'
    description: 'وقتی تماس مستقیم از پیام متنی مناسب‌تر است، از این مسیر استفاده کنید.'
    icon: 'i-lucide-phone'
    label: 'تماس تلفنی'
    buttonIcon: 'i-lucide-phone-call'
    to: 'phone'

  - title: 'تلگرام'
    description: 'برای شروع سریع گفت‌وگو، هماهنگی اولیه و پیگیری پیام‌ها مناسب است.'
    icon: 'i-simple-icons-telegram'
    label: 'پیام در تلگرام'
    buttonIcon: 'i-lucide-arrow-up-right'
    to: 'telegram'
    target: '_blank'

  - title: 'گیت‌هاب'
    description: 'کدها، تجربه‌ها و فعالیت‌های متن‌باز من را ببینید.'
    icon: 'i-simple-icons-github'
    label: 'گیت‌هاب من'
    buttonIcon: 'i-lucide-arrow-up-right'
    to: 'https://github.com/REZAakt'
    target: '_blank'

workTitle: 'برای چه کارهایی می‌توانید پیام بدهید'
workDescription: 'بهترین نقطه همکاری من پروژه‌های اختصاصی، کاربردی و فرایندمحور است؛ جایی که هم معماری فنی مهم است و هم تجربه کاربری تمیز.'

workTypes:
  - title: 'وب‌اپلیکیشن اختصاصی'
    description: 'اپلیکیشن‌های Nuxt و Blazor، پورتال، پنل مدیریت، ابزار کسب‌وکاری و رابط‌های محصول.'
    icon: 'i-lucide-panels-top-left'

  - title: 'داشبورد، ERP و سیستم مدیریتی'
    description: 'سیستم داخلی، داشبورد گزارش‌گیری، ثبت سفارش، اتوماسیون اداری و نرم‌افزارهای فرایندمحور.'
    icon: 'i-lucide-monitor-cog'

  - title: 'بک‌اند دات‌نت و معماری'
    description: 'API با ASP.NET، مدل داده، منطق کسب‌وکار، یکپارچه‌سازی و ساختار قابل نگهداری.'
    icon: 'i-simple-icons-dotnet'

  - title: 'دسکتاپ و نرم‌افزار صنعتی'
    description: 'WPF، WinUI، ابزارهای مبتنی بر Modbus، تسترها، کنترل کیفیت و نرم‌افزارهای مرتبط با فرایند سخت‌افزاری.'
    icon: 'i-lucide-cpu'

processTitle: 'چطور شروع کنیم'
processDescription: 'یک پیام شفاف برای شروع کافی است تا مشخص شود پروژه برای همکاری مناسب است یا نه.'

process:
  - title: 'زمینه پروژه را بفرستید'
    description: 'بگویید چه چیزی را می‌خواهید بسازید، بهتر کنید، اتوماسیون کنید یا بازطراحی کنید و چه مسئله‌ای باید حل شود.'

  - title: 'دامنه کار را بررسی می‌کنم'
    description: 'فرایند، ریسک‌های فنی، پیچیدگی رابط کاربری، انتخاب تکنولوژی و قدم اول عملی را بررسی می‌کنم.'

  - title: 'قدم بعدی را مشخص می‌کنیم'
    description: 'اگر همکاری منطقی باشد، دامنه، زمان‌بندی، روش همکاری و مسیر واقع‌بینانه اجرا را مشخص می‌کنیم.'

faqTitle: 'پاسخ‌های سریع'
faqDescription: 'چند سؤال رایج قبل از ارتباط.'

faqs:
  - label: 'آیا به‌صورت دورکاری همکاری می‌کنی؟'
    content: 'بله. امکان همکاری دورکاری وجود دارد و بسته به پروژه، همکاری ترکیبی هم ممکن است.'

  - label: 'چه پروژه‌هایی مناسب همکاری هستند؟'
    content: 'وب‌اپلیکیشن اختصاصی، داشبورد، سیستم ERP، ابزار اتوماسیون، نرم‌افزار صنعتی، کنترل کیفیت و محصولاتی که فرایند واقعی دارند.'

  - label: 'فقط فرانت‌اند کار می‌کنی؟'
    content: 'تمرکز اصلی من فرانت‌اند و تجربه کاربری است، اما با ASP.NET، دات‌نت، طراحی API، نرم‌افزار دسکتاپ و معماری اپلیکیشن هم تجربه جدی دارم.'

cta:
  title: 'برای پروژه‌تان نیاز به راهنمایی دارید؟'
  description: 'برای ساخت سایت، وب‌اپلیکیشن، داشبورد یا نرم‌افزار اختصاصی، می‌توانید یک پیام کوتاه بفرستید. نیازتان را بررسی می‌کنم و کمک می‌کنم مسیر مناسب‌تری برای شروع انتخاب کنید.'
  primaryAction: 'مشاوره اولیه رایگان'
  to: 'https://t.me/REZA_akT'
  target: '_blank'
