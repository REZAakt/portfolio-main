seo:
  title: 'تماس با رضا اکبرپور'
  description: 'برای همکاری در پروژه‌های Nuxt، Blazor، ASP.NET، داشبورد، ERP، اتوماسیون، نرم‌افزار صنعتی و وب‌اپلیکیشن اختصاصی با رضا اکبرپور در تماس باشید.'

title: 'درباره نرم‌افزاری که می‌خواهید بسازید صحبت کنیم'
description: 'من روی نرم‌افزارهای اختصاصی، وب‌اپلیکیشن‌ها، داشبوردهای مدیریتی، سیستم‌های ERP، ابزارهای صنعتی، فرایندهای اتوماسیون و رابط‌های کاربری تمیز با معماری درست کار می‌کنم.'

primaryAction: 'ارسال ایمیل'

email: 'rreza.aak@gmail.com'
emailSubject: 'درخواست همکاری یا پروژه'
emailBody: |
  سلام رضا،

  می‌خواهم درباره یک پروژه صحبت کنم.

  نوع پروژه:
  زمان‌بندی:
  حدود بودجه:
  توضیح کوتاه:

location: 'ایران'
responseTime: 'معمولاً کمتر از ۲۴ ساعت'

availability:
  label: 'وضعیت فعلی'
  title: 'آماده همکاری برای پروژه‌های منتخب'
  badge: 'آماده همکاری'
  description: 'برای پروژه‌های نرم‌افزاری معنادار، وب‌اپلیکیشن‌های اختصاصی، داشبوردها، ابزارهای اتوماسیون و همکاری‌های فنی در دسترس هستم.'
  unavailableTitle: 'فعلاً پروژه جدید نمی‌پذیرم'
  unavailableBadge: 'بسته'
  unavailableDescription: 'در حال حاضر پروژه جدید قبول نمی‌کنم. با این حال می‌توانید پیام بدهید تا وقتی زمانم آزاد شد پاسخ بدهم.'

