about:
  title: 'درباره من'
  description: |
    من رضا اکبرپورم؛ توسعه‌دهنده نرم‌افزار و وب‌اپلیکیشن با تجربه در ساخت بک‌اند با ASP.NET، وب‌اپلیکیشن‌های SPA، سیستم‌های مدیریتی و ERP، داشبوردهای سازمانی، فروشگاه‌ها، سامانه‌های آموزشی، سیستم‌های ثبت سفارش، ابزارهای صنعتی، تسترها و سیستم‌های کنترل کیفیت.

    مسیر من از دات‌نت و نرم‌افزارهای دسکتاپ شروع شد و بعد به ساخت وب‌اپلیکیشن با Blazor و Nuxt رسید. طراحی هم از کودکی بخشی از دنیای من بوده؛ از نقاشی و طراحی صنعتی تا طراحی رابط کاربری. برای همین در پروژه‌ها، UX را فقط یک بخش ظاهری نمی‌بینم؛ برایم مهمه کاربر موقع استفاده از نرم‌افزار حس خوبی داشته باشه و بدون پیچیدگی، به چیزی که نیاز داره برسه.
