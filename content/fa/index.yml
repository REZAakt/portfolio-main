faq:
  title: پرسش‌های متداول
  description: چند سؤال رایج درباره نوع پروژه‌ها، همکاری و مسیر کاری من.
  categories:
    - title: پروژه
      questions:
        - label: چه نوع پروژه‌هایی انجام می‌دهی؟
          content: |
            بیشتر روی پروژه‌های اختصاصی و فرایندمحور کار می‌کنم؛ مثل سایت‌های شرکتی، فروشگاه‌ها، داشبوردهای مدیریتی، ERP، وب‌اپلیکیشن‌ها، ابزارهای صنعتی، سیستم‌های کنترل کیفیت، اتوماسیون اداری، سامانه‌های ثبت سفارش، پیام‌رسان‌ها، چت با هوش مصنوعی و بات‌های تلگرام.

        - label: فقط فرانت‌اند کار می‌کنی یا بک‌اند هم انجام می‌دهی؟
          content: |
            تمرکز و علاقه اصلی من فرانت‌اند و تجربه کاربری است، اما از ابتدا با ASP.NET و دات‌نت کار کرده‌ام و در بک‌اند، طراحی API و ساختار نرم‌افزار هم تجربه جدی دارم. برای همین می‌توانم پروژه را فقط از زاویه ظاهر نبینم و ارتباط بخش‌های مختلف سیستم را بهتر درک کنم.

        - label: با استارتاپ‌ها هم کار می‌کنی؟
          content: |
            بله، کار با استارتاپ‌ها را دوست دارم؛ مخصوصاً وقتی ایده هنوز در حال شکل گرفتن است و نیاز دارد سریع، دقیق و قابل توسعه به یک محصول واقعی تبدیل شود.

    - title: فرایند
      questions:
        - label: زمان انجام پروژه چقدر است؟
          content: |
            زمان پروژه کاملاً به اندازه و پیچیدگی آن بستگی دارد. بعضی پروژه‌ها در چند هفته قابل انجام‌اند، اما سیستم‌های بزرگ‌تر مثل ERP، داشبوردهای سازمانی یا نرم‌افزارهای فرایندمحور معمولاً چند ماه زمان می‌برند.

        - label: هزینه و شرایط پرداخت چطور مشخص می‌شود؟
          content: |
            هزینه بر اساس محدوده کار، امکانات، زمان‌بندی و سطح پیچیدگی پروژه مشخص می‌شود. معمولاً برای شروع پروژه بخشی از مبلغ به عنوان پیش‌پرداخت دریافت می‌شود تا زمان‌بندی، تعهد دوطرفه و شروع رسمی کار مشخص باشد. جزئیات پرداخت هم داخل قرارداد تعیین می‌شود.

        - label: بعد از تحویل پروژه پشتیبانی داری؟
          content: |
            بله، پشتیبانی پروژه بر اساس مواردی که در قرارداد مشخص می‌شود انجام می‌دهم؛ از رفع مشکلات احتمالی تا اصلاحات و توسعه امکانات جدید. مدت و نوع پشتیبانی هم بسته به پروژه قابل توافق است.

    - title: درباره من
      questions:
        - label: چه چیزی کارت را متفاوت می‌کند؟
          content: |
            ترکیب تجربه فنی و نگاه طراحی. از یک طرف با دات‌نت، ASP.NET، Blazor، Nuxt، نرم‌افزارهای دسکتاپ و پروژه‌های صنعتی کار کرده‌ام؛ از طرف دیگر طراحی از کودکی بخشی از زندگی من بوده. همین ترکیب باعث شده هم به ساختار نرم‌افزار توجه کنم، هم به تجربه‌ای که کاربر از آن می‌گیرد.

        - label: چه چیزی را در کارت بیشتر دوست داری؟
          content: |
            بیشترین چیزی که دوست دارم، تبدیل کردن یک ایده به محصول واقعی است. مخصوصاً وقتی ایده کمی جاه‌طلبانه باشد و نیاز داشته باشد هم از نظر فنی درست فکر شود، هم از نظر تجربه کاربری خوب اجرا شود.

        - label: رزومه و نمونه‌کارهایت را از کجا ببینیم؟
          content: |
            نمونه‌کارها در صفحه پروژه‌ها قرار دارند. اگر زمان کمی دارید، در ابتدای صفحه اصلی دکمه رزومه را گذاشته‌ام تا بتوانید نسخه PDF رزومه من را مستقیم دانلود کنید.
