faq:
  title: پرسش‌های متداول
  description: پاسخ به سؤال‌های رایج درباره فرایند کاری و خدمات من.
  categories:
    - title: خدمات و فرایند
      questions:
        - label: چه خدماتی ارائه می‌دهی؟
          content: |
            من روی طراحی تجربه و رابط کاربری و توسعه فرانت‌اند تمرکز دارم؛ از تحقیق کاربر، وایرفریم و پروتوتایپ تعاملی تا ساخت وب‌سایت‌ها و وب‌اپلیکیشن‌های واکنش‌گرا با Vue و Nuxt و طراحی سیستم‌های طراحی.
        - label: فرایند طراحی تو چطور است؟
          content: |
            فرایند من مشارکتی و تکرارشونده است و معمولاً شامل شناخت مسئله، تحقیق، ایده‌پردازی، پروتوتایپ، تست کاربری، طراحی بصری و همکاری نزدیک با تیم توسعه در زمان پیاده‌سازی می‌شود.
        - label: با استارتاپ‌ها هم کار می‌کنی؟
          content: |
            بله. کار با استارتاپ‌ها را دوست دارم، چون می‌توانم از مراحل اولیه به شکل‌گیری محصول، تجربه کاربری و رابط کاربری کمک کنم و فرایند را با سرعت و نیازهای تیم هماهنگ کنم.
    - title: هزینه و زمان‌بندی
      questions:
        - label: هزینه یک پروژه معمولاً چقدر است؟
          content: |
            هزینه پروژه به محدوده کار، پیچیدگی، امکانات و زمان‌بندی بستگی دارد. بعد از بررسی نیازها، برآورد دقیق‌تری از هزینه و زمان ارائه می‌دهم.
        - label: شرایط پرداخت چطور است؟
          content: |
            معمولاً بخشی از مبلغ در شروع پروژه دریافت می‌شود و باقی‌مانده بعد از تکمیل و تحویل کار پرداخت می‌شود. جزئیات پرداخت بر اساس نوع پروژه مشخص می‌شود.
        - label: یک پروژه معمولاً چقدر زمان می‌برد؟
          content: |
            زمان‌بندی به محدوده و پیچیدگی پروژه بستگی دارد. پروژه‌های کوچک ممکن است چند هفته زمان ببرند و پروژه‌های بزرگ‌تر معمولاً چند ماه طول می‌کشند.
        - label: پشتیبانی یا همکاری مداوم هم داری؟
          content: |
            بله، برای تیم‌هایی که به طراحی، توسعه قابلیت‌های جدید یا نگهداری مداوم نیاز دارند، امکان همکاری ماهانه یا بلندمدت وجود دارد.
    - title: درباره من
      questions:
        - label: چه چیزی را در کارت بیشتر دوست داری؟
          content: |
            حل مسئله‌های پیچیده با ترکیب طراحی و تکنولوژی را دوست دارم. برایم جذاب است چیزی بسازم که هم از نظر فنی درست باشد و هم برای کاربر ساده و قابل فهم.
        - label: خارج از کار به چه چیزهایی علاقه داری؟
          content: |
            بیرون از کار معمولاً مطالعه می‌کنم، چیزهای تازه یاد می‌گیرم، روی پروژه‌های شخصی کار می‌کنم و گاهی هم در پروژه‌های متن‌باز مشارکت می‌کنم.
