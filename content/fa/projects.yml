title: بعضی از کارایی که انجام دادم
description: هر کدوم از این پروژه‌ها یه مسئله‌ی متفاوت داشتن؛ یه جا باید یه تجربه‌ی گیج‌کننده رو ساده می‌کردم، یه جا باید بین ظاهر خوب و عملکرد درست تعادل پیدا می‌کردم. سعی کردم توی هرکدوم هم به جزئیات فکر کنم هم به این‌که کاربر بدون سردرگمی به هدفش برسه. اینایی که این‌جا گذاشتم رو انتخاب کردم چون فکر می‌کنم بهتر از بقیه نشون می‌دن چطور کار می‌کنم .
