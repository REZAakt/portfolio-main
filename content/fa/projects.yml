title: بعضی از کارایی که انجام دادم
description: هر کدوم از این پروژه‌ها چالش خاص خودشو داشت؛ جایی باید یه تجربه‌ی گیج‌کننده رو ساده می‌کردم و جایی باید بین ظاهر مناسب و عملکرد درست تعادل برقرار می‌کردم. در تک‌تک‌شون سعی کردم هم به جزئیات توجه کنم و هم به این‌که کاربر بدون سردرگمی به هدفش برسه. مواردی که این‌جا گذاشته‌ام تنها بخشی از کارهایم هستند؛ پروژه‌های بزرگ و متوسط دیگری هم دارم که این نمونه‌ها را از میان آن‌ها انتخاب کرده‌ام، مثل همین پروژه‌ی پورتفولیو که هم‌اکنون در حال مشاهده‌ی آن هستید، چون فکر می‌کنم بهتر از بقیه نحوه‌ی کار من را نشان می‌دهند.
