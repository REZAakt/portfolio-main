title: درباره من
description: رضا اکبرپور؛ توسعه‌دهنده نرم‌افزار، وب‌اپلیکیشن و تجربه‌های دیجیتال با تمرکز روی محصول‌های اختصاصی، داشبورد، ERP، اتوماسیون و رابط‌های کاربری.
content: |
  من **رضا اکبرپور** هستم؛ توسعه‌دهنده نرم‌افزار و وب‌اپلیکیشن با تمرکز روی ساخت محصول‌های اختصاصی، کاربردی و قابل نگهداری. تجربه اصلی من در ساخت بک‌اند با **ASP.NET**، وب‌اپلیکیشن‌های **Nuxt** و **Blazor**، داشبوردهای مدیریتی، سیستم‌های ERP، اتوماسیون اداری، سامانه‌های ثبت سفارش، فروشگاه‌ها، ابزارهای صنعتی، تسترها و سیستم‌های کنترل کیفیت است.

  مسیر کاری من از دات‌نت و نرم‌افزارهای دسکتاپ شروع شد؛ از **WPF** و **WinUI** تا پروژه‌هایی که با سخت‌افزار، Modbus و فرایندهای صنعتی درگیر بودند. بعد از آن تمرکزم بیشتر به سمت وب‌اپلیکیشن‌ها، پنل‌های مدیریتی، API، معماری نرم‌افزار و تجربه کاربری رفت. همین ترکیب باعث شده پروژه را فقط از زاویه ظاهر یا فقط از زاویه کد نبینم؛ برای من مهم است نرم‌افزار هم درست ساخته شود، هم استفاده از آن برای کاربر روشن و روان باشد.

  ### نگاه من به طراحی و توسعه

  طراحی برای من فقط زیبا کردن صفحه نیست. از کودکی طراحی، نقاشی و بعدتر طراحی صنعتی بخشی از دنیای من بوده و همین نگاه وارد کار نرم‌افزاری‌ام شده است. وقتی روی یک محصول کار می‌کنم، به ساختار فنی، مسیر کاربر، سادگی تصمیم‌ها، سرعت انجام کار و حس کلی استفاده از سیستم کنار هم فکر می‌کنم.

  در پروژه‌های اختصاصی، معمولاً مسئله فقط ساخت چند صفحه نیست. باید فرایند واقعی کسب‌وکار فهمیده شود، داده‌ها درست جریان پیدا کنند، بخش‌های مختلف سیستم با هم هماهنگ باشند و رابط کاربری طوری طراحی شود که کاربر برای انجام کارهای روزمره با نرم‌افزار نجنگد.

  ### چه پروژه‌هایی برای من جذاب‌ترند

  بیشتر با پروژه‌هایی ارتباط می‌گیرم که یک مسئله واقعی را حل می‌کنند؛ مثل وب‌اپلیکیشن‌های اختصاصی، داشبوردهای مدیریتی، ERP، ابزارهای اتوماسیون، سیستم‌های کنترل کیفیت، نرم‌افزارهای صنعتی، پنل‌های داخلی، فروشگاه‌ها، پلتفرم‌های آموزشی، پیام‌رسان‌ها، چت‌های مبتنی بر هوش مصنوعی و بات‌های تلگرام.

  چیزی که برایم ارزشمند است، تبدیل کردن یک ایده یا فرایند پیچیده به محصولی است که قابل استفاده، قابل توسعه و قابل اعتماد باشد. مخصوصاً وقتی پروژه نیاز دارد هم از نظر فنی درست فکر شود، هم از نظر تجربه کاربری ساده و دقیق اجرا شود.

  ### همکاری

  اگر قصد ساخت سایت، وب‌اپلیکیشن، داشبورد، سیستم مدیریتی یا نرم‌افزار اختصاصی دارید، می‌توانید از صفحه [تماس](/contact) پیام بدهید. برای دیدن نمونه‌کارها هم صفحه [پروژه‌ها](/projects) بهترین نقطه شروع است.
