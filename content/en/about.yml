title: About Me
description: Reza Akbarpour is a software, web application, and digital experience developer focused on custom products, dashboards, ERP-style systems, automation, and clean user interfaces.
content: |
  I’m **Reza Akbarpour**, a software and web application developer focused on building custom, practical, and maintainable digital products. My work covers **ASP.NET** backends, **Nuxt** and **Blazor** web applications, management dashboards, ERP-style systems, office automation, order management platforms, online stores, industrial tools, testers, and quality control systems.

  My path started with .NET and desktop software, from **WPF** and **WinUI** to projects connected with hardware, Modbus, and industrial workflows. Over time, my focus moved deeper into web applications, admin panels, APIs, software architecture, and user experience. That mix helps me look at a project from more than one angle: the software needs to be built properly, but it also needs to feel clear and usable for the people working with it.

  ### How I Think About Design And Development

  Design, for me, is not just about making screens look better. Drawing, visual thinking, and later industrial design have been part of my world since childhood, and that way of thinking naturally shaped how I build software. When I work on a product, I care about the technical structure, the user flow, the simplicity of each decision, the speed of everyday tasks, and the overall feeling of using the system.

  In custom software, the challenge is usually not just building a few pages. The real workflow has to be understood, data needs to move correctly, different parts of the system need to work together, and the interface should help users do their work without fighting the software.

  ### The Work I Care About Most

  I’m most interested in projects that solve a real operational problem: custom web applications, management dashboards, ERP-style tools, automation systems, quality control software, industrial software, internal panels, online stores, learning platforms, messaging systems, AI chat interfaces, and Telegram bots.

  What I enjoy most is turning an idea or a complex process into a product that is usable, scalable, and reliable. That is especially interesting when the project needs both solid technical thinking and a simple, thoughtful user experience.

  ### Collaboration

  If you are planning to build a website, web application, dashboard, management system, or custom software, you can reach me through the [contact page](/en/contact). To see examples of my work, the [projects page](/en/projects) is the best place to start.
