faq:
  title: 'Frequently Asked Questions'
  description: 'A few common questions about the kind of projects I work on, how collaboration usually starts, and the way I think about software.'
  categories:
    - title: 'Projects'
      questions:
        - label: 'What kind of projects do you work on?'
          content: |
            I mostly work on custom, process-driven projects — things like company websites, online stores, management dashboards, ERPs, web apps, industrial tools, quality control systems, office automation, order management platforms, messaging systems, AI chat interfaces, and Telegram bots.

        - label: 'Do you only work on frontend, or backend too?'
          content: |
            My main focus and interest is frontend and user experience, but I started with .NET and ASP.NET and I have solid experience with backend development, API design, and software architecture too. So I don’t look at a project only from the visual side — I can understand how the different parts of the system should connect and work together.

        - label: 'Do you work with startups?'
          content: |
            Yes. I enjoy working with startups, especially when the idea is still taking shape and needs to become a real, usable product quickly — but in a way that can still grow later.

    - title: 'Process'
      questions:
        - label: 'How long does a project take?'
          content: |
            It depends completely on the size and complexity of the project. Some projects can be done in a few weeks, but bigger systems like ERPs, enterprise dashboards, or process-driven software usually take a few months.

        - label: 'How do you define the cost and payment terms?'
          content: |
            The cost depends on the scope, features, timeline, and complexity of the project. Usually, part of the amount is paid upfront so the timeline, mutual commitment, and official start of the project are clear. The payment details are defined in the contract.

        - label: 'Do you provide support after delivery?'
          content: |
            Yes. Project support is based on what we define in the contract — from fixing possible issues to making improvements or adding new features. The duration and type of support can be agreed on depending on the project.

    - title: 'About Me'
      questions:
        - label: 'What makes your work different?'
          content: |
            The mix of technical experience and design thinking. On one side, I’ve worked with .NET, ASP.NET, Blazor, Nuxt, desktop software, and industrial projects. On the other side, design has been part of my life since childhood. That combination helps me care about both the structure behind the software and the experience people get from using it.

        - label: 'What do you enjoy most about your work?'
          content: |
            What I enjoy most is turning an idea into a real product — especially when the idea is a bit ambitious and needs to be thought through properly from both the technical side and the user experience side.

        - label: 'Where can I see your resume and portfolio?'
          content: |
            You can see my work on the Projects page. And if you’re short on time, I’ve added a resume button at the top of the homepage so you can download the PDF version directly.
