about:
  title: 'About Me'
  description: |
    I’m Reza Akbarpour, a software and web application developer with experience in building ASP.NET backends, SPA web apps, management systems and ERPs, enterprise dashboards, online stores, learning platforms, order management systems, industrial tools, testers, and quality control systems.

    My path started with .NET and desktop software, then moved into web applications with Blazor and Nuxt. Design has also been part of my world since childhood — from drawing and industrial design to user interface design. That’s why I don’t see UX as just the “visual layer” of a project. I care about how the software feels, how simple it is to use, and whether the user can get where they need to go without fighting the interface.
