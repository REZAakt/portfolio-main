processTitle: 'How we can start'
processDescription: 'A clear first message is enough to understand whether the project is a good fit.'

process:
  - title: 'Send the context'
    description: 'Tell me what you want to build, improve, automate, or redesign, and what problem it should solve.'

  - title: 'I review the scope'
    description: 'I check the workflow, technical risks, UI complexity, possible stack, and the practical first step.'

  - title: 'We define the next move'
    description: 'If it makes sense, we define scope, timeline, collaboration method, and a realistic path forward.'

faqTitle: 'Quick answers'
faqDescription: 'A few common questions before reaching out.'

faqs:
  - label: 'Do you work remotely?'
    content: 'Yes. I can work remotely and, depending on the project, hybrid collaboration is also possible.'

  - label: 'What kind of projects are a good fit?'
    content: 'Custom web applications, dashboards, ERP-style systems, automation tools, industrial software, quality control systems, and products with real workflows.'

  - label: 'Do you only work on frontend?'
    content: 'Frontend and UX are my main focus, but I also have solid experience with ASP.NET, .NET, API design, desktop software, and application architecture.'

