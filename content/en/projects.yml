title: Some of the work I've done
description: Each of these projects came with its own kind of problem to solve — sometimes it was untangling a confusing user experience, sometimes it was finding the balance between good looks and things actually working. I tried to pay attention to the details in every one of them, while making sure people could get where they needed to go without getting lost. What you see here is only part of what I've done — I've got other big and medium-sized projects too, and I picked these ones out of all of them, like this very portfolio project you're looking at right now, because I think they show how I work better than the rest.
