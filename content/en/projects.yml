title: Some of the work I've done
description: Each of these projects came with its own kind of problem to solve — sometimes it was untangling a confusing user experience, sometimes it was finding the balance between good looks and things actually working. I tried to pay attention to the details in every one of them, while making sure people could get where they needed to go without getting lost. These are the ones I picked because I think they show how I work better than the rest.
